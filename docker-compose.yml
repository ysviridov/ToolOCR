services:
  db:
    image: postgres:16-bookworm
    container_name: toolocr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toolocr}
      POSTGRES_USER: ${POSTGRES_USER:-toolocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toolocr_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - toolocr_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolocr} -d ${POSTGRES_DB:-toolocr}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  importer:
    build:
      context: ./importer
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-toolocr}
      PGUSER: ${POSTGRES_USER:-toolocr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-toolocr_dev_password}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build:
      context: ./api
    container_name: toolocr-api
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-toolocr}
      PGUSER: ${POSTGRES_USER:-toolocr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-toolocr_dev_password}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TOOLOCR_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ocr:
    build:
      context: ./ocr
    container_name: toolocr-ocr
    restart: unless-stopped
    environment:
      OCR_MAX_UPLOAD_MB: ${OCR_MAX_UPLOAD_MB:-20}
      OCR_MAX_PIXELS: ${OCR_MAX_PIXELS:-40000000}
      OCR_DEFAULT_LANG: ${OCR_DEFAULT_LANG:-rus+eng}
      OCR_DEFAULT_PSM: ${OCR_DEFAULT_PSM:-11}
      LAYOUT_CAMERA_CALIBRATION: ${LAYOUT_CAMERA_CALIBRATION:-/app/config/camera-calibration.json}
      ORIENTATION_TEXT_OSD: ${ORIENTATION_TEXT_OSD:-1}
      ORIENTATION_TEXT_OSD_MAX_SIDE: ${ORIENTATION_TEXT_OSD_MAX_SIDE:-1800}
      TEST_UI_STORAGE_DIR: ${TEST_UI_STORAGE_DIR:-/app/test-data}
      TEST_UI_MAX_FILES_PER_RUN: ${TEST_UI_MAX_FILES_PER_RUN:-100}
    volumes:
      - ./config:/app/config:ro
      - toolocr_testdata:/app/test-data
    ports:
      - "${TOOLOCR_OCR_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  toolocr_pgdata:
  toolocr_testdata:
